[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra-fast-proxy-fetcher-tester"
version = "2.0.0"
description = "Bounded public proxy fetching, validation, and reporting"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fusion Technology Strategies" }]
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Proxy Servers",
]

[project.scripts]
proxy-fetcher-tester = "proxy_fetcher_ultimate:main"

[project.urls]
Repository = "https://github.com/fusiontechstrategies/Ultra-Fast-Proxy-Fetcher-Tester"
Issues = "https://github.com/fusiontechstrategies/Ultra-Fast-Proxy-Fetcher-Tester/issues"

[tool.setuptools]
py-modules = ["proxy_fetcher_ultimate"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["ASYNC", "B", "BLE", "DTZ", "E4", "E7", "E9", "F", "I", "PERF", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
exclude = ["^tmp/"]
