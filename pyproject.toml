[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["ASYNC", "B", "BLE", "DTZ", "E4", "E7", "E9", "F", "I", "PERF", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
exclude = ["^tmp/"]
