name: Feature request
description: Suggest a focused reliability, safety, or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What authorized use case is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain how the change preserves the responsible-use safeguards.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: responsible
    attributes:
      label: Responsible use
      options:
        - label: This request does not seek to bypass access controls, rate limits, safeguards, or third-party policies.
          required: true
