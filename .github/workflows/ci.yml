name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify dependency installation
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Check installable package entry point
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --disable-pip-version-check --no-deps .
          proxy-fetcher-tester --version
          proxy-fetcher-tester --help

      - name: Type check
        run: python -m mypy proxy_fetcher_ultimate.py

      - name: Security lint
        run: python -m bandit -q -r proxy_fetcher_ultimate.py scripts

  platform-test:
    name: platform-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependency installation
        run: python -m pip check

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.10.1,<3.0"

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit development dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Audit distribution build dependencies
        run: python -m pip_audit -r requirements-build.txt

  release-artifact:
    name: Release artifact Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Resolve reproducible build epoch
        id: build-epoch
        shell: bash
        run: echo "value=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build exact candidate twice
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build-epoch.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build --no-isolation --wheel --sdist --outdir package-dist
          python scripts/normalize_wheel.py --source-date-epoch "$SOURCE_DATE_EPOCH" package-dist/*.whl
          python scripts/normalize_sdist.py --source-date-epoch "$SOURCE_DATE_EPOCH" package-dist/*.tar.gz
          python scripts/verify_distribution.py package-dist --version 2.0.1
          python -m twine check package-dist/*
          python scripts/prepare_release.py \
            --version 2.0.1 \
            --tag v2.0.1 \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dist-dir package-dist \
            --output-directory release-candidate
          python scripts/prepare_release.py \
            --version 2.0.1 \
            --tag v2.0.1 \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dist-dir package-dist \
            --output-directory repeat-release-candidate
          test "$(find release-candidate -maxdepth 1 -type f -printf '%f\n' | sort)" = \
            "$(find repeat-release-candidate -maxdepth 1 -type f -printf '%f\n' | sort)"
          for artifact in release-candidate/*; do
            cmp --silent "$artifact" "repeat-release-candidate/${artifact##*/}"
          done
          test "$(find release-candidate -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Exercise the exact standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(python release-candidate/Ultra-Fast-Proxy-Fetcher-Tester-v2.0.1.py --version)" = \
            "Ultra-Fast Proxy Fetcher & Tester 2.0.1"
          python release-candidate/Ultra-Fast-Proxy-Fetcher-Tester-v2.0.1.py --help >/dev/null

      - name: Preserve the exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-fetcher-v2.0.1-candidate-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

  distribution-candidate:
    name: Reproducible installable distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build and compare distributions
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH="$epoch"
          python -m build --no-isolation --wheel --sdist --outdir package-dist
          python scripts/normalize_wheel.py --source-date-epoch "$epoch" package-dist/*.whl
          python scripts/normalize_sdist.py --source-date-epoch "$epoch" package-dist/*.tar.gz
          python scripts/verify_distribution.py package-dist --version 2.0.1
          python -m twine check package-dist/*
          python -m build --no-isolation --wheel --sdist --outdir package-repeat
          python scripts/normalize_wheel.py --source-date-epoch "$epoch" package-repeat/*.whl
          python scripts/normalize_sdist.py --source-date-epoch "$epoch" package-repeat/*.tar.gz
          diff --recursive --brief package-dist package-repeat

      - name: Exercise both installation formats with offline CLI checks
        shell: bash
        run: |
          set -euo pipefail
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install --disable-pip-version-check package-dist/*.whl
          wheel-venv/bin/proxy-fetcher-tester --version
          wheel-venv/bin/proxy-fetcher-tester --help >/dev/null
          python -m venv sdist-venv
          sdist-venv/bin/python -m pip install --disable-pip-version-check package-dist/*.tar.gz
          sdist-venv/bin/proxy-fetcher-tester --version
          sdist-venv/bin/proxy-fetcher-tester --help >/dev/null
