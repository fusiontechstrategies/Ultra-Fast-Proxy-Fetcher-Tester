name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      manifest: ${{ steps.assets.outputs.manifest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve and validate release identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must contain a stable semantic version" >&2
            exit 1
          fi
          release_commit="$(git rev-list --max-count=1 "$GITHUB_REF_NAME")"
          test "$release_commit" = "$GITHUB_SHA"
          python -I scripts/verify_release_integrity.py source "$release_commit"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_commit" --jq '.commit.verification.verified')"
          test "$verified" = "true"
          test -f ".github/release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct "$release_commit")" >> "$GITHUB_OUTPUT"

      - name: Install complete hash-locked runtime and build dependencies
        run: |
          python -I -m pip install --only-binary=:all: --disable-pip-version-check --require-hashes -r requirements-release-lock.txt

      - name: Build exact release assets twice
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.epoch }}
        shell: bash
        run: |
          set -euo pipefail
          python -I -m build --no-isolation --wheel --sdist --outdir package-dist
          python -I scripts/normalize_wheel.py --source-date-epoch "$SOURCE_DATE_EPOCH" package-dist/*.whl
          python -I scripts/normalize_sdist.py --source-date-epoch "$SOURCE_DATE_EPOCH" package-dist/*.tar.gz
          python -I scripts/verify_distribution.py package-dist --version "$RELEASE_VERSION"
          python -I -m twine check package-dist/*
          python -I -m build --no-isolation --wheel --sdist --outdir package-repeat
          python -I scripts/normalize_wheel.py --source-date-epoch "$SOURCE_DATE_EPOCH" package-repeat/*.whl
          python -I scripts/normalize_sdist.py --source-date-epoch "$SOURCE_DATE_EPOCH" package-repeat/*.tar.gz
          diff --recursive --brief package-dist package-repeat
          python -I scripts/prepare_release.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dist-dir package-dist \
            --output-directory release-assets
          python -I scripts/prepare_release.py \
            --version "$RELEASE_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$RELEASE_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --dist-dir package-repeat \
            --output-directory repeat-release-assets
          test "$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)" = \
            "$(find repeat-release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          for artifact in release-assets/*; do
            cmp --silent "$artifact" "repeat-release-assets/${artifact##*/}"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Capture immutable candidate identity before execution
        id: assets
        run: echo "manifest=$(python -I scripts/verify_release_integrity.py assets release-assets -)" >> "$GITHUB_OUTPUT"

      - name: Exercise the exact standalone runtime
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -I "release-assets/Ultra-Fast-Proxy-Fetcher-Tester-v$RELEASE_VERSION.py" --version)" = \
            "Ultra-Fast Proxy Fetcher & Tester $RELEASE_VERSION"
          python -I "release-assets/Ultra-Fast-Proxy-Fetcher-Tester-v$RELEASE_VERSION.py" --help >/dev/null

      - name: Preserve the exact release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

